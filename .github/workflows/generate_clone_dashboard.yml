name: Generate Clone Dashboard

permissions:
  contents: write
 
concurrency:
  group: clone-metrics
  cancel-in-progress: true

on:
  schedule:
    - cron: '21 3 * * 1'  # Every Monday at 03:19 UTC
  workflow_dispatch:

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1


      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install .

      - name: Generate dashboard image
        run: python -m clonepulse.generate_clone_dashboard --user per2jensen --repo clonepulse

      - name: Check dashboard image exists
        run: |
          if [ ! -f clonepulse/weekly_clones.png ]; then
            echo "❌ Dashboard image not found"
            exit 1
          fi

      - name: Commit dashboard update
        run: |
          git config --local user.name "github-actions"
          git config --local user.email "actions@github.com"
          git add -A "clonepulse/weekly_clones.png"
          if ! git diff --cached --quiet; then
            echo "📦 Changes detected, committing dashboard..."
            git commit -m "CI update:  'weekly clones dashboard'"
            git push
          else
            echo "🟢 No changes in dashboard — nothing to commit."
          fi
