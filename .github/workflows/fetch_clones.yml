name: Update GitHub Clone Metrics

permissions:
  contents: write

concurrency:
  group: clone-metrics
  cancel-in-progress: true

on:
  schedule:
    - cron: '17 2 * * *'  # Run daily at 02:17 UTC
  workflow_dispatch:

jobs:
  update-clones:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install .

      - name: Run fetch_clones.py
        env:
          TOKEN: ${{ secrets.CLONEPULSE_METRICS }}
        run: |
          python -m clonepulse.fetch_clones \
            --user per2jensen \
            --repo clonepulse

      - name: Show Git status (debug)
        run: |
          echo "::group::Git Status"
          git status
          echo "::endgroup::"
          echo "::group::Git Diff"
          git diff
          echo "::endgroup::"
          echo "::group::Untracked Files"
          git ls-files --others --exclude-standard
          echo "::endgroup::"

      - name: Commit changes
        run: |
          git config --local user.name "github-actions"
          git config --local user.email "actions@github.com"

          find clonepulse -type f \( -name '*.json' -o -name '*.txt' \) -print0 \
            | xargs -0 --no-run-if-empty git add --
          if ! git diff --cached --quiet; then
            echo "Changes detected, committing..."
            git commit -m "CI update: 'fetched clones' data on $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            git push
          else
            echo "No changes to commit."
          fi
